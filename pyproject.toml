[build-system]
build-backend = "setuptools.build_meta"
requires = [
    # We do not declare an explicit setuptools min version for a variety of reasons. FWIW, last time it was tested, setuptools 59 (max with Python 3.6) still mostly worked.
    "setuptools",
    "ctypesgen @ git+https://github.com/pypdfium2-team/ctypesgen@pypdfium2",
    "packaging",
    # NB: wheel is no longer needed with setuptools >= v70.1.0, but we still specify it for backward compatibility
    "wheel !=0.38.0, !=0.38.1",
]

# We prefer dependency-groups (PEP 735) over optional-dependencies (extras), for two main reasons:
# - Installation is independent of pypdfium2 itself. e.g. you can install the setup group first, then install pypdfium2 with --no-build-isolation. Likewise, you may want to install the converters or test dependencies without re-installing pypdfium2.
# - BUG(177): PyPI actually refuses upload if external (@ git+) dependencies end up in package metadata. PEP 735 emphasizes the idea that dependency groups "are not included in any built distribution of the project".
[dependency-groups]
converters = ["pillow", "numpy"]
test = ["pytest", "tabulate", {include-group = "converters"}]
setup = [
    "setuptools >= v70.1.0",  # or older setuptools + `wheel`
    "ctypesgen @ git+https://github.com/pypdfium2-team/ctypesgen@pypdfium2",
    "build",
    "macholib; sys_platform == 'darwin'",
]
docs = [
    "sphinx >= 7.2.5",
    "sphinx-rtd-theme",
    "sphinxcontrib-programoutput",
    "sphinx-issues",
    "myst-parser",
]
check = ["autoflake", "codespell", "reuse"]
distcheck = ["twine", "check-wheel-contents"]
# Reminder: When updating the GN version, remember to update the references below as well.
gn = ["gn-dist==2407.3"]

[tool.check-wheel-contents]
# W002: erroneous detection of __init__.py files as duplicates
# W009: Wheel contains multiple toplevel library entries
# W010: Toplevel library directory contains no Python modules (pypdfium2.libs)
ignore = ["W002", "W009", "W010"]

[tool.cibuildwheel]
build-frontend = {name="build", args=["-xn"]}
environment-pass = ["TEST_PDFIUM", "PDFIUM_VER", "USE_SYSROOT"]
before-build = [
    "pip install --uploaded-prior-to P7D --group setup",
]
test-command = [
    "python -m pypdfium2_cli --help",
    "python -m pypdfium2_cli --version",
    "python {project}/utils/minitest.py",
]

[tool.cibuildwheel.linux]
manylinux-armv7l-image = "ghcr.io/mayeut/manylinux_2_35:latest"

[tool.cibuildwheel.linux.environment]
PDFIUM_PLATFORM = "sourcebuild-native"
# Vendored libc++ probably won't build with our older containers' GCC.
# It says the minimum requirement is GCC 15 or Clang 20 which is too high e.g. for Ubuntu 24.04.
BUILD_PARAMS = "--vendor all --no-vendor libc++"

[tool.cibuildwheel.macos.environment]
PDFIUM_PLATFORM = "sourcebuild-toolchained"
# cibw/delocate want a deployment target to be set
# TODO this will need to be updated to 13 once we build pdfium > 7928
MACOSX_DEPLOYMENT_TARGET = "12.0.0"
# Make sure the OS yields its real version
SYSTEM_VERSION_COMPAT = "0"

[tool.cibuildwheel.windows.environment]
PDFIUM_PLATFORM = "sourcebuild-toolchained"

[tool.cibuildwheel.pyodide.environment]
PDFIUM_PLATFORM = "sourcebuild-native"
BUILD_PARAMS = "--pyodide --vendor all --no-vendor libc++"

[[tool.cibuildwheel.overrides]]
# run actual test suite on platforms that have pillow and numpy prebuilds on PyPI
select = "*-*linux_{x86_64,aarch64} *-macosx_{x86_64,arm64} *-win_{amd64,arm64} *-win32 *-pyodide_*"
test-requires = ["pytest", "pillow", "numpy"]
inherit.test-command = "append"
test-command = [
    "python -m pytest {project}/tests",
]

[[tool.cibuildwheel.overrides]]
select = "*-pyodide_*"
build-frontend = {name="pyodide-build", args=["-xn"]}

# Suppress possible test suite failure with pyodide (it's flaky).
# We don't publish pyemscripten wheels to PyPI because of these known issues, just upload the experimental builds to GH, so suppression is OK here, and actually necessary to not risk failing the entire release (otherwise we'd just have to exclude pyodide, while this allows us to carry it along as experimental).
[[tool.cibuildwheel.overrides]]
select = "*-pyodide_*"
inherit.test-command = "none"
test-command = [
    "python -m pypdfium2_cli --help",
    "python -m pypdfium2_cli --version",
    "python {project}/utils/minitest.py",
    "sh -c 'python -m pytest {project}/tests || true'",
]

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_*"
before-all = [
    "dnf clean all && dnf makecache --refresh",
    "dnf -y install ninja-build",  # freetype-devel lcms2-devel libjpeg-devel openjpeg2-devel libpng-devel libtiff-devel zlib-devel glib2-devel harfbuzz-devel
    # "sh -c 'dnf -y install gn || true'",  # not manylinux_{i686,riscv64}
]

# manylinux_armv7l uses a Ubuntu-based image, for lack of an RHEL-based one
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_armv7l"
before-all = [
    "apt-get update",
    "apt-get install -y ninja-build",  # generate-ninja libfreetype-dev liblcms2-dev libjpeg-dev libopenjp2-7-dev libpng-dev libtiff-dev zlib1g-dev libglib2.0-dev libharfbuzz-dev  # libicu-dev
]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux_*"
inherit.before-all = "append"
before-all = [
    "apk add ninja-build",  # gn freetype-dev lcms2-dev jpeg-dev openjpeg-dev libpng-dev tiff-dev zlib-dev glib-dev
]
inherit.environment = "append"
environment.PATH = "/usr/lib/ninja-build/bin:$PATH"

[[tool.cibuildwheel.overrides]]
select = "*-*linux_{x86_64,i686,aarch64,armv7l,ppc64le,s390x,riscv64} *-pyodide_*"  # not loongarch64
inherit.before-build = "append"
before-build = [
    # TODO install latest gn-dist if it's latest pdfium
    "pip install --only-binary :all: --group gn",
]

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_loongarch64"
inherit.before-build = "append"
before-build = [
    "curl -LO 'https://github.com/pypdfium2-team/gn-dist/releases/download/2407.3/gn_dist-2407.3-py3-none-manylinux_2_36_loongarch64.manylinux_2_38_loongarch64.whl'",
    "pip install ./gn_dist-*_loongarch64.whl"
]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux_loongarch64"
inherit.before-build = "append"
before-build = [
    "curl -LO 'https://github.com/pypdfium2-team/gn-dist/releases/download/2407.3/gn_dist-2407.3-py3-none-musllinux_1_2_loongarch64.whl'",
    "pip install ./gn_dist-*_loongarch64.whl"
]

[[tool.cibuildwheel.overrides]]
select = "*-*linux_{ppc64le,riscv64,loongarch64,s390x}"
inherit.environment-pass = "append"
environment-pass = ["RUNNER_ARCH"]
inherit.before-all = "prepend"
before-all = [
    "manylinux-install-clang -v latest",
    "export CLANG_PREFIX=/opt/clang",
    "ln -s $CLANG_PREFIX/bin/readelf $CLANG_PREFIX/bin/llvm-readelf",
]
inherit.environment = "append"
# on glibc linux with static clang, we try to use the vendored libc++
# beware: this overrides the default BUILD_PARAMS from above
environment.BUILD_PARAMS = "--vendor all --compiler clang --clang-path /opt/clang --no-libclang-rt"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux_{ppc64le,riscv64,loongarch64,s390x}"
inherit.environment = "append"
# vendored libc++ is not compatible with musl
environment.BUILD_PARAMS = "$BUILD_PARAMS --no-vendor libc++"

[[tool.cibuildwheel.overrides]]
select = "*-*linux_s390x"
inherit.environment = "append"
environment.BUILD_PARAMS = "$BUILD_PARAMS --clang-as-gcc"

# Cross-compiled or hybrid macOS and Windows targets

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
inherit.environment = "append"
environment.BUILD_PARAMS = "--target-cpu x64"

[[tool.cibuildwheel.overrides]]
select = "*-win_arm64"
inherit.environment = "append"
environment.BUILD_PARAMS = "--target-cpu arm64"

[[tool.cibuildwheel.overrides]]
select = "*-win32"
inherit.environment = "append"
environment.BUILD_PARAMS = "--target-cpu x86"

